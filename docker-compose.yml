version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: okx-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: okx_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - okx_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okx_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-http:
    build:
      context: ./system
      dockerfile: Dockerfile
    container_name: okx-agent-http
    restart: unless-stopped
    env_file:
      - ./system/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_CALLBACK_URL_MESSAGES: http://app-http:8000/webhooks/scraper/messages
      OKX_AGENT_PERSISTENCE__DATABASE_URL: ${OKX_AGENT_PERSISTENCE__DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/okx_agent}
      OKX_AGENT_SCRAPER__BASE_URL: ${OKX_AGENT_SCRAPER__BASE_URL:-http://scraper:8010}
    depends_on:
      postgres:
        condition: service_healthy
      scraper:
        condition: service_started
    ports:
      - "8000:8000"
    command: ["python", "-m", "app.workers.http_server"]

  app-telegram:
    build:
      context: ./system
      dockerfile: Dockerfile
    container_name: okx-agent-telegram
    restart: unless-stopped
    profiles: ["telegram"]
    env_file:
      - ./system/.env
    environment:
      APP_CALLBACK_URL_MESSAGES: http://app-http:8000/webhooks/scraper/messages
      OKX_AGENT_PERSISTENCE__DATABASE_URL: ${OKX_AGENT_PERSISTENCE__DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/okx_agent}
      OKX_AGENT_SCRAPER__BASE_URL: ${OKX_AGENT_SCRAPER__BASE_URL:-http://scraper:8010}
    depends_on:
      postgres:
        condition: service_healthy
      app-http:
        condition: service_started
      scraper:
        condition: service_started
    command: ["python", "-m", "app.workers.telegram_polling"]

  app-exit-monitor:
    build:
      context: ./system
      dockerfile: Dockerfile
    container_name: okx-agent-exit-monitor
    restart: unless-stopped
    profiles: ["monitor"]
    env_file:
      - ./system/.env
    environment:
      APP_CALLBACK_URL_MESSAGES: http://app-http:8000/webhooks/scraper/messages
      OKX_AGENT_PERSISTENCE__DATABASE_URL: ${OKX_AGENT_PERSISTENCE__DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgres:5432/okx_agent}
      OKX_AGENT_SCRAPER__BASE_URL: ${OKX_AGENT_SCRAPER__BASE_URL:-http://scraper:8010}
    depends_on:
      postgres:
        condition: service_healthy
      app-http:
        condition: service_started
    command: ["python", "-m", "app.workers.exit_monitor"]

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: okx-agent-scraper
    restart: unless-stopped
    env_file:
      - ./scraper/.env
    environment:
      SCRAPER_HOST: 0.0.0.0
      SCRAPER_PORT: 8010
      SCRAPER_DATABASE_URL: ${SCRAPER_DATABASE_URL:-sqlite+pysqlite:///./data/scraper.db}
    ports:
      - "8010:8010"
    volumes:
      - okx_agent_scraper_data:/app/data
    command: ["python", "-m", "app.workers.http_server"]

volumes:
  okx_agent_postgres_data:
  okx_agent_scraper_data:
